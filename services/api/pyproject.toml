[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guiyin-api"
version = "0.1.0"
description = "归音家庭情感协同 AI App 的 FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"] # FastAPI intentionally constructs Depends in signatures.
