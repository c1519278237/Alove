services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: guiyin
      POSTGRES_USER: guiyin
      POSTGRES_PASSWORD: guiyin-local-only
    ports:
      - "5432:5432"
    volumes:
      - guiyin_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guiyin -d guiyin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - guiyin_redis:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://guiyin:guiyin-local-only@postgres:5432/guiyin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  guiyin_postgres:
  guiyin_redis:

